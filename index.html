<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shr_logic_box</title>
</head>
<style>
    .a
    {
        
        border: 3px solid hsl(197, 72%, 92%);
        height: 500px;
        width: 500px;
        background-color: hsl(197, 72%, 92%);
        margin: auto;
        border-radius: 10px;
        box-shadow: 0px 0px 10px 3px #052257;
        overflow: auto;
        transition: transform 0.3s ease;
        
    }
    ::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: hsl(197, 72%, 92%);
    border-radius: 10px;
}

::-webkit-scrollbar-thumb {
    background: hsl(197, 72%, 92%);
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #9e9e9e;
}

    /* .a:hover{
        transform: scale(1.03);
        transition: background 0.8s ease;
    } */
    .b{
        margin: 50px;
        text-align: center;
    }
    button{
        margin: 5px;
        border-radius: 5px;
        background-color: rgb(159, 205, 243);
        padding: 7px;
        border: 2px solid rgb(159, 205, 243);
        box-shadow: 0 0 4px 1px rgb(7, 31, 91);
/* transition: background 0.5s ease; */
    }
    button:hover{
        border: 2px solid #2b6b92;
        background-color: #2b6b92;
        color: white;
        box-shadow: 0 0 4px 1px rgb(8, 39, 70);
    }
    #e{
        color: rgb(12, 7, 97);
        font-size: 20px;
    }
    #f{
        border:2px solid rgb(8, 25, 84);
    }
    #c{
        background-color: rgb(159, 205, 243);
        height: 30px;
        align-items: center;
        border-radius: 5px;
        border: 2px solid rgb(159, 205, 243);
        box-shadow: 0 0 4px 1px rgb(7, 31, 91);
    }
    
.p{
    font-size: 30px;
    text-align: left;
    color: #08397e;

}
h1{

    margin: auto;
    text-align: center;
    width: 200px;
    border-radius: 5px;
    color: rgb(18, 47, 151) ;
    background-color: rgb(159, 205, 243);
        padding: 7px;
        border: 2px solid rgb(159, 205, 243);
        box-shadow: 0 0 4px 1px rgb(7, 31, 91);
}
</style>
<body>
    <br><br>
    
    <div class="a">
        <br>
        <h1>Logic Box</h1>
        <hr size="3px" color="rgb(7, 31, 91)">
        <div class="b">
            <input type="number" name="" id="c" placeholder="Enter a number">
            <br><br>
            <div>
                <div class="p">Check
                    <br>
                    <button onclick="chkp(),chk()">Prime</button>
                    <button onclick="arm(),chk()">Armstrong</button>
                    <button onclick="evod(),chk()">Perfect Number</button>
                    <button onclick="palin(),chk()">Palindrome</button>
                </div>
                <br>
                <div class="p">Display
                    <br>

                    <button onclick="fact(),chk()">Factorial</button>
                    <button onclick="prime(),chk()">Primes</button>
                    <button onclick="fac(),chk()">Factors</button>
                    <button onclick="fibo(),chk()">Fibonacci</button>
                    <br>
                    <button onclick="tri(),chk()">Triangular Numbers</button>
                </div>
            </div>
            <br>
            <br>
            <div id="e"></div>
        </div>
    </div>
</body>
<script>
    function chk(){
let z=document.getElementById("c");
    z=Number(z.value);
    if(!z || z <= 0){
    document.getElementById("e").innerText = "Please enter a positive number!";
    return;
    }
}

    function fac(){
        
    
        let f=[];
        let x=document.getElementById("c");
        let ip=Number(x.value);
for(let i=1;i<=ip;i++){
    
    if(ip%i===0)
    f.push(i);
    }
    document.getElementById("e").innerText="Factors are : "+f.join(", ");
    }
    function fact(){
        let f=1;
        let x=document.getElementById("c");
        let n=Number(x.value);
        for(let i=1;i<=n;i++){
            f=f*i;
        }
        document.getElementById("e").innerText="Factorial = "+f;
    }
    function chkp(){
        let f=0;
        let x=document.getElementById("c");
        let n=Number(x.value);
        for(let i=2;i<n;i++){
            if(n%i===0)
            f++;
        }
        if(f===0)
        document.getElementById("e").innerText="It is Prime";
    else
    document.getElementById("e").innerText="It is not Prime"
    }
    function evod(){
        let f=0;
        let x=document.getElementById("c");
        let ip=Number(x.value);
for(let i=1;i<ip;i++){
    
    if(ip%i===0)
    f=f+i;
    }
    if(f===ip)
    document.getElementById("e").innerText="It is a Perfect Number";
    else
    document.getElementById("e").innerText="It is not a Perfect Number";
    }
    function fibo(){
        let f=0;
        let ar=[];
        let x=document.getElementById("c");
        let ip=Number(x.value);
        let a=0,b=1;
        ar.push(a);
        for(let i=0;i<ip-1;i++){
            ar.push(b);
            f=a+b;
            a=b;
            b=f;
        }
        document.getElementById("e").innerText="Fibonacci Series = "+ar.join(", ");
    }
    function prime(){
        let f=0;
        let ar=[];
        let x=document.getElementById("c");
        let ip=Number(x.value);
        for(let i=2;i<=ip;i++){
            for(let j=2;j<i;j++){
                if(i%j===0){
                    f++;
                }
            }
            if(f===0)
            ar.push(i);
        f=0;
        }
        document.getElementById("e").innerText="Prime Numbers = "+ar.join(", ");
    }
    function tri(){
        let f=0;
        let ar=[];
        let x=document.getElementById("c");
        let ip=Number(x.value);
        let a=1,b=2;
        // ar.push(a);
        for(let i=1;i<ip;i++){
            f=i+f;
            ar.push(f);
        }
        document.getElementById("e").innerText="Triangular Numbers = "+ar.join(", ");
    }
    function palin(){
        let f=0;
        let ar=[];
        let x=document.getElementById("c");
        let ip=Number(x.value);
        let y=ip;
        while(y!=0){
            let r=y%10;
            f=f*10+r;
            y=Math.floor(y/10);
        }
        document.getElementById("e").classList.add("f");
        if(ip===f)
        document.getElementById("e").innerText="Yes it a Palindrome number";
        else
        document.getElementById("e").innerText="It is not a Palindrome number"
    }
    function arm(){
        let f=0;
        let ar=[];
        let x=document.getElementById("c");
        let ip=Number(x.value);
        let y=ip;
        let s=0;
        while(y!=0){
            let r=y%10;
            f++;
            y=Math.floor(y/10);
        }
        y=ip;
        while(y!=0){
            let r=y%10;
            s=Math.pow(r,f)+s;
            y=Math.floor(y/10);
        }
        if(s===ip)
        document.getElementById("e").innerText="It is an Armstrong number"
    else
    document.getElementById("e").innerText="It is not an Armstrong number"
    
    

    }

</script>
</html>
